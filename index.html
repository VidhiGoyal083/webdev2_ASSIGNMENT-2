<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Async Weather Tracker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">



    <!-- CSS code  -->


    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(120deg, #0f2027, #203a43, #2c5364);
    min-height: 100vh;
    padding: 30px;
}

/* Container */
.container {
    max-width: 1200px;
    margin: auto;
}

/* Title */
h1 {
    text-align: center;
    color: #ffffff;
    margin-bottom: 30px;
    font-size: 2.5rem;
    letter-spacing: 1px;
}

/* Cards Layout */
.parent-card {
    display: flex;
    gap: 25px;
}

/* Glass Card */
.card {
    flex: 1;
    padding: 25px;
    border-radius: 20px;
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    color: #fff;
    transition: 0.3s;
}

.card:hover {
    transform: translateY(-5px);
}

/* Headings */
.card h3 {
    margin-bottom: 15px;
    font-weight: 500;
}

/* Input */
.input-group {
    display: flex;
    gap: 10px;
}

input {
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    border: none;
    outline: none;
    background: rgba(255,255,255,0.2);
    color: #fff;
    font-size: 14px;
}

input::placeholder {
    color: #ddd;
}

/* Button */
button {
    padding: 12px 20px;
    border-radius: 10px;
    border: none;
    background: linear-gradient(45deg, #ff7e5f, #feb47b);
    color: white;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.05);
    box-shadow: 0 5px 15px rgba(255,126,95,0.5);
}

/* Weather Info */
.weather-item {
    display: flex;
    justify-content: space-between;
    padding: 12px;
    margin-bottom: 10px;
    border-radius: 10px;
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(10px);
    font-size: 14px;
}

/* History Buttons */
.history button {
    margin: 5px;
    padding: 8px 15px;
    border-radius: 20px;
    background: rgba(255,255,255,0.2);
    border: 1px solid rgba(255,255,255,0.3);
    font-size: 13px;
}

.history button:hover {
    background: #ffffff;
    color: #333;
}

/* Responsive */
@media (max-width: 768px) {
    .parent-card {
        flex-direction: column;
    }

    h1 {
        font-size: 2rem;
    }
}
    </style>


<!-- CSS code ended -->


</head>


<!-- .html code  -->


<body>
    <div class="container">

        <h1>🌤 Async Weather Tracker</h1>

        <div class="parent-card">
            <div class="card">
                <h3>Search City</h3>
                <div class="input-group">
                    <input id="cityInput" placeholder="Delhi, London">
                    <button id="searchBtn">Search</button>
                </div>
                <br>
                <br>
                <h3>Search History</h3>
                <div class="history" id="history"></div>
            </div>

            <div class="card">
                <h3>Weather Info</h3>
                <div id="weather"></div>
            </div>
        </div>

    </div>

    <!-- .html code ended -->


    <!-- JavaScript code -->


    <script>
        const API_KEY = "94807011d0fdd892d5b067e0d3664bc6";
        //    const API_KEY = "94807011d0fdd892d5b067e0d3664bc6";

        const weatherBox = document.getElementById("weather");
        const historyBox = document.getElementById("history");
        const cityInput = document.getElementById("cityInput");

        /* ---------- WEATHER FETCH ---------- */
        async function getWeather(city) {

            // small delay for smoother UI
            // await new Promise(r => setTimeout(r, 500));

            const res = await fetch(
                `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${API_KEY}&units=metric`
            );
            if (!res.ok) {
                alert("city not found");
                throw new Error("City not found");
            }
            const data = await res.json();
            return data;
        }

         /* ---------- BUTTON CLICK ---------- */
        document.getElementById("searchBtn").onclick = () => {
            const city = cityInput.value.trim();
            if (city) {
                search(city);
            }
        };

        /* ---------- UI RENDER ---------- */
        function renderWeather(d) {
            weatherBox.innerHTML = `
        <div class="weather-item"><label>City</label><span>${d.name}, ${d.sys.country}</span></div>
        <div class="weather-item"><label>Temperature</label><span>${d.main.temp} °C</span></div>
        <div class="weather-item"><label>Weather</label><span>${d.weather[0].main}</span></div>
        <div class="weather-item"><label>Humidity</label><span>${d.main.humidity}%</span></div>
        <div class="weather-item"><label>Wind Speed</label><span>${d.wind.speed} m/s</span></div>
    `;
        }

        /* ---------- SAVE SEARCH HISTORY ---------- */
        function saveHistory(city) {
            let history = JSON.parse(localStorage.getItem("weatherHistory")) || [];

        // avoid duplicates
            if (!history.includes(city)) {
                history.unshift(city); // add at beginning
            }

    // limit history to 5 items
            history = history.slice(0, 5);

            localStorage.setItem("weatherHistory", JSON.stringify(history));

            showHistory();
        }

        /* ---------- SHOW HISTORY ---------- */
        function showHistory() {
           const history = JSON.parse(localStorage.getItem("weatherHistory")) || [];

           historyBox.innerHTML = "";

           history.forEach(city => {
                const btn = document.createElement("button");
                btn.textContent = city;

                btn.onclick = () => {
                    search(city);
                };

                historyBox.appendChild(btn);
            });
        }

        /* ---------- SEARCH FUNCTION ---------- */
        async function search(city) {
            weatherBox.innerHTML = "<p>Loading...</p>";
            try {
                const data = await getWeather(city);
                renderWeather(data);
                saveHistory(data.name); 
            } catch (error) {
                weatherBox.innerHTML = `<p style="color:red">${error.message}</p>`;
            }
        }
       
        /* ---------- ENTER KEY SEARCH ---------- */
        cityInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
                const city = cityInput.value.trim();
                if (city) {
                    search(city);
                }
            }
        });
        /* ---------- INITIAL LOAD ---------- */
        showHistory();
    </script>


    <!-- JavaScript code end  -->
</body>

</html>
